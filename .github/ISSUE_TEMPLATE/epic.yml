name: Epic
description: Decompose an initiative into a bounded deliverable.
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] Observable criterion\n- [ ] Observable criterion"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: textarea
    id: human-gate
    attributes:
      label: Human stop gate
    validations:
      required: true
  - type: textarea
    id: estimate
    attributes:
      label: Estimate
      value:
        "- Size: \n- Focused engineering hours: \n- Confidence: \n- Key uncertainty: "
    validations:
      required: true
